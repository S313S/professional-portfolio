<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Coding Workstation cover</title>
  <desc id="desc">AI-assisted development workstation cover with notes, prompt library, and terminal panes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121e"/>
      <stop offset="0.5" stop-color="#12253b"/>
      <stop offset="1" stop-color="#091018"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#cfe2f6"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a111d"/>
      <stop offset="1" stop-color="#13253a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.2">
    <circle cx="220" cy="210" r="2" fill="#fff"/>
    <circle cx="440" cy="128" r="2" fill="#fff"/>
    <circle cx="875" cy="190" r="2" fill="#fff"/>
    <circle cx="1290" cy="240" r="2" fill="#fff"/>
    <circle cx="1438" cy="670" r="2" fill="#fff"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="128" y="148" fill="#f3f8ff" font-size="70" font-weight="800">Vibe Coding</text>
    <text x="132" y="204" fill="#9fb8d6" font-size="28" letter-spacing="4">WORKSTATION</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="128" y="280" width="448" height="420" rx="32" fill="url(#pane)"/>
    <rect x="174" y="336" width="312" height="28" rx="14" fill="#13253a"/>
    <rect x="174" y="398" width="346" height="18" rx="9" fill="#8aa4c0"/>
    <rect x="174" y="442" width="300" height="18" rx="9" fill="#8aa4c0"/>
    <rect x="174" y="486" width="224" height="18" rx="9" fill="#8aa4c0"/>
    <rect x="174" y="566" width="142" height="58" rx="24" fill="#8ad9ff"/>
    <rect x="334" y="566" width="152" height="58" rx="24" fill="#f4c46b"/>
  </g>
  <g filter="url(#shadow)" font-family="JetBrains Mono, monospace">
    <rect x="640" y="236" width="450" height="508" rx="34" fill="url(#terminal)" stroke="#395878"/>
    <rect x="640" y="236" width="450" height="70" rx="34" fill="#17283b"/>
    <circle cx="690" cy="271" r="11" fill="#78ffd6"/>
    <circle cx="728" cy="271" r="11" fill="#8ad9ff"/>
    <circle cx="766" cy="271" r="11" fill="#f4c46b"/>
    <text x="690" y="378" fill="#78ffd6" font-size="28">$ ask codex</text>
    <text x="690" y="440" fill="#dceaff" font-size="24">plan -> patch -> test</text>
    <text x="690" y="500" fill="#dceaff" font-size="24">prompt library synced</text>
    <text x="690" y="560" fill="#dceaff" font-size="24">notes translated</text>
    <text x="690" y="620" fill="#8ad9ff" font-size="24">ready for next build</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1160" y="312" width="300" height="300" rx="36" fill="#f3f8ff"/>
    <path d="M1220 396H1400M1220 456H1368M1220 516H1388" stroke="#17314a" stroke-width="20" stroke-linecap="round"/>
    <path d="M1198 644C1288 610 1354 614 1442 644" stroke="#78ffd6" stroke-width="12" stroke-linecap="round"/>
  </g>
  <path d="M576 488H640M1090 488H1160" stroke="#8ad9ff" stroke-width="8" stroke-linecap="round" opacity="0.82"/>
</svg>
