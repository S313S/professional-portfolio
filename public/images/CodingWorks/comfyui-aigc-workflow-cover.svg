<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ComfyUI AIGC Creation Workflow cover</title>
  <desc id="desc">Node-based AIGC workflow cover with prompt, model, sampler, and output nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#14263d"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263c5c" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#101b2c" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78ffd6"/>
      <stop offset="0.5" stop-color="#8ad9ff"/>
      <stop offset="1" stop-color="#f4c46b"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.82 0 0 0 0 1 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600" stroke="#d8e8ff" stroke-width="1"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900" stroke="#d8e8ff" stroke-width="1"/>
  </g>
  <g filter="url(#softGlow)">
    <path d="M334 284C446 184 590 186 704 287C824 393 925 390 1034 284C1138 182 1286 202 1372 322" fill="none" stroke="url(#glow)" stroke-width="7" stroke-linecap="round"/>
    <path d="M282 586C405 466 557 466 680 586C807 710 965 706 1088 585C1198 476 1332 490 1430 596" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="128" y="148" fill="#eaf4ff" font-size="72" font-weight="800">ComfyUI</text>
    <text x="132" y="204" fill="#9fb8d8" font-size="28" letter-spacing="4">AIGC CREATION WORKFLOW</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="24" fill="#dceaff">
    <g transform="translate(130 318)">
      <rect width="260" height="130" rx="24" fill="url(#panel)" stroke="#6dd7c8" stroke-width="2"/>
      <circle cx="36" cy="38" r="9" fill="#78ffd6"/>
      <text x="62" y="47">Prompt</text>
      <text x="36" y="88" fill="#9fb8d8" font-size="18">style + subject</text>
    </g>
    <g transform="translate(492 230)">
      <rect width="300" height="150" rx="24" fill="url(#panel)" stroke="#8ad9ff" stroke-width="2"/>
      <circle cx="38" cy="42" r="9" fill="#8ad9ff"/>
      <text x="66" y="51">Model Loader</text>
      <text x="38" y="96" fill="#9fb8d8" font-size="18">checkpoint / lora</text>
    </g>
    <g transform="translate(500 516)">
      <rect width="300" height="150" rx="24" fill="url(#panel)" stroke="#f4c46b" stroke-width="2"/>
      <circle cx="38" cy="42" r="9" fill="#f4c46b"/>
      <text x="66" y="51">Sampler</text>
      <text x="38" y="96" fill="#9fb8d8" font-size="18">seed / steps / cfg</text>
    </g>
    <g transform="translate(920 316)">
      <rect width="250" height="132" rx="24" fill="url(#panel)" stroke="#78ffd6" stroke-width="2"/>
      <circle cx="38" cy="40" r="9" fill="#78ffd6"/>
      <text x="66" y="49">Preview</text>
      <text x="38" y="90" fill="#9fb8d8" font-size="18">inspect output</text>
    </g>
    <g transform="translate(1262 304)">
      <rect width="222" height="166" rx="28" fill="#eaf4ff" opacity="0.94"/>
      <rect x="22" y="24" width="178" height="118" rx="18" fill="#1d3b5c"/>
      <path d="M44 118C82 78 113 94 138 65C157 43 181 52 200 72V142H44Z" fill="#78ffd6" opacity="0.72"/>
      <circle cx="164" cy="58" r="17" fill="#f4c46b"/>
    </g>
  </g>
  <g stroke="#d7e8ff" stroke-width="3" stroke-linecap="round" opacity="0.76">
    <path d="M390 382H492"/>
    <path d="M792 308H920"/>
    <path d="M650 380V516"/>
    <path d="M800 590C870 590 865 382 920 382"/>
    <path d="M1170 382H1262"/>
  </g>
</svg>
